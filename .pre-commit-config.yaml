repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
        # The lockfile is generated text and grows past the limit once the
        # inference extra is resolved. The limit is there to stop data and
        # weights.
        exclude: ^uv\.lock$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout

  - repo: local
    hooks:
      # Runs in the project environment so mypy sees the same pinned
      # dependencies as `make typecheck`.
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        # pyproject.toml holds the mypy settings, so a change there re-runs it.
        files: ^(src/.*\.py|pyproject\.toml)$
        pass_filenames: false
      - id: check-style
        name: comment and doc style
        entry: python3 scripts/agent/check_style.py
        language: system
        types_or: [python, markdown]
