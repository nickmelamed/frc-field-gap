# Settings shared by every pipeline stage. Paths are relative to the repo root.

# One seed for Python, NumPy, and any framework in use, so sampling and
# splits come out the same on every run.
seed: 2026

paths:
  raw_dir: data/raw
  reports_dir: reports
  manifests_dir: reports/data_manifests
  assets_dir: docs/assets
  field_test_dir: data/field_test
  # Contact sheets can show faces and are never published, so they stay
  # under the gitignored data/ directory.
  contact_sheet_dir: data/contact_sheets
  harmonized_dir: data/harmonized
  # Versions downloaded back from Roboflow to check an upload.
  platform_dir: data/platform

inspect:
  # COCO's small and medium limits (32 and 96 pixels square) scaled to a
  # 640 pixel square input, so buckets mean the same thing at any resolution.
  area_buckets:
    small_max: 0.0025
    medium_max: 0.0225
  # Boxes may overhang the image edge by this much before they count as
  # invalid, to allow for rounding in exported coordinates.
  box_tolerance_px: 1
  # Largest Hamming distance between 64-bit perceptual hashes that still
  # counts as a near duplicate. See D-010.
  near_duplicate_max_distance: 4
  # Example pairs kept per kind in reports/duplicates.json.
  max_examples: 20
  # Larger cells than the grid so small boxes stay visible
  # (frc-inspect --contact-sheet).
  contact_sheet:
    rows: 3
    cols: 4
    tile_px: 480
  grid:
    rows: 4
    cols: 4
    tile_px: 320
    # Below the 500 KB large-file hook.
    max_bytes: 450000
    # Images left out of the published sample grids because a person's face
    # can be made out. Distant crowds in overhead broadcast shots are kept.
    exclude:
      marswars:
        - Basler_daA1280-54uc__24770352__20260112_180305685_0210_png.rf.b40a0a55f146f485842e11df2ce40771.jpg
      testingfrfr:
        - Palmetto_Regional_2020_Practice11-mp4_01793_png.rf.a2d2d0395e6d40c266dbf6edb764e0c1.jpg
        - PXL_20220219_190751379_jpg.rf.f05b868a0791a1a302fd0666385eb010.jpg
        - Match-9-R3-2024-FIM-District-Milford-Event-presented-by-GM-Milford-Proving-Ground_mp4-0013_jpg.rf.0d701bcc80297b53e6d546ab416db0ac.jpg
        - Palmetto_Regional_2020_Practice02-mp4_01137_png.rf.34a0cb2cef083af50c7c30b1e71b41c6.jpg
        - Great_Northern_Regional_2020_Practice23-mp4_00657_png.rf.974ca13c3aac2958118b64e696f9b700.jpg
        - Chinese_Team_cyber-mp4_01808_png.rf.e16e1200cad8e30a3f1f85568ab4de4e.jpg
        - AjnQ-GF-LxI_24_jpg.rf.383801156bd18d31dd786e06ebc106ac.jpg
      scorekeeper:
        - frc_train_486_jpg.rf.6fea1a9968929ab2e2108349a4621082.jpg
        - z6S7XrF5CI0_3_jpg.rf.85300f901b2993feebb5fddfe1875caf.jpg
        - youtube-47_jpg.rf.8146c5006d3ba11719ee2c95df2c4b6d.jpg
        - youtube-129_jpg.rf.e44f2aae349ff2bd94fb58615ffb4a94.jpg
        - FRC_3_mp4-4_jpg.rf.6d996c77f6f9102953c59b9d026cf8fb.jpg
        - youtube-19_jpg.rf.a56715b9c2890fe929978c5a6d1cb548.jpg
        - ncash2023_gopro3-mp4_00805_png.rf.7f96d0520faf1b0c2b32db16fc191ea1.jpg
        - youtube-15_jpg.rf.a81798214470ddbd444c348ab9b29c1b.jpg
        - FRC_3_mp4-26_jpg.rf.31bfbd8f50e2dd92f354977e2f850ae9.jpg
        - youtube-32_jpg.rf.ee5c85e6951fac99a8642552d2a9fee6.jpg
        - youtube-56_jpg.rf.a0dcf146f9de78d932ca82ff18152db7.jpg
        - 20230401_085358-mp4_00570_png.rf.f9e2173175ce62cb507c185e19a8c6e9.jpg
        - 20230401_085358-mp4_00570_png.rf.efff637aa9f7937adbc0d89e4e69c5c7.jpg
        - frc_train_456_jpg.rf.ee5204b2b4a4bd9b409ca8ef7b53f978.jpg
      pankratz:
        - IMG_7033_jpg.rf.57d2374977263a382f80990e9ac73f43.jpg
    # Source names left out of the grids as a whole. Most of the lockbox is
    # webcam frames of one person close to the camera (D-026).
    exclude_patterns:
      pankratz:
        - '^WIN_'

# Datasets whose own splits leak are re-split by harmonize. Near duplicates
# use inspect.near_duplicate_max_distance. See D-013.
splits:
  fractions:
    train: 0.70
    valid: 0.15
    test: 0.15
  # Frames this close to a split boundary are dropped from the earlier split.
  # Frames 5 apart are rarely near duplicates (D-013).
  buffer_frames: 5
  # Shorter recordings go whole to train, since they are too short to cut.
  min_recording_images: 20
  datasets:
    marswars:
      method: temporal
      recording_pattern: '^(?P<recording>.+?)[_-](?P<frame>\d+)\.(?:jpg|jpeg|png)$'
      # FIRST's official videos are edited from many shots, so their last
      # frames are a different scene, not later in one run. Keeping them out
      # of test keeps A-test on robot-camera footage (D-013).
      train_only_pattern: '^2026-FIRST-Robotics-Competition-'
    robotzftp2:
      method: temporal
      recording_pattern: '^(?P<recording>.+?)[_-](?P<frame>\d+)\.(?:jpg|jpeg|png)$'
    scorekeeper:
      method: grouped
      # Only video frames and 11-character YouTube ids name a recording.
      # Stems like `frame` and `youtube` are shared by unrelated images.
      recording_pattern: '^(?P<recording>.+[_-]mp4|[A-Za-z0-9_-]{11})[_-]\d+\.(?:jpg|jpeg|png)$'
      # Train holds three augmented copies of each photo. Keep one (D-014).
      dedupe_copies: true
    pankratz:
      # The lockbox is only scored, so every image goes to test (D-026).
      method: eval_only
      # Frames of one phone video share a unit. Photos are joined by pHash.
      recording_pattern: '^(?P<recording>.+_mov)-\d+\.(?:jpg|jpeg|png)$'

# Run frc-merge after frc-harmonize (D-028).
merge:
  name: merged
  report: reports/merge.json
  sources:
    marswars:
      role: keep_splits
      # FIRST's official videos show robots with no robot labels, which a
      # two-class model would learn as background.
      exclude_pattern: '^2026-FIRST-Robotics-Competition-'
    robotzftp2:
      role: keep_splits
    scorekeeper:
      role: keep_splits
      # The fuel photos have unlabeled balls in their clusters (D-021).
      exclude_pattern: '^frame_\d+\.'
      # Two byte-identical copies of one frame with different labels. The
      # first labels a person as a robot, and Roboflow gave the upload the
      # second copy's labels, which failed the version check (D-028).
      exclude_files:
        - youtube-16_jpg.rf.03c351a731f5daa26d6a94c42c502e5a.jpg
        - youtube-16_jpg.rf.727bdb5da1deef78c6328ee5f5913ac4.jpg
    testingfrfr:
      role: train_only
      # Train holds about three augmented copies of each photo, some turned
      # on their side. Keep one, as for scorekeeper (D-014).
      dedupe_copies: true
  # Never trained on. The field test set is always protected.
  protected: [pankratz]

# Roboflow project in the API key's workspace that frc-upload sends
# harmonized training data to. Create it in the web app first, so its
# license is chosen on purpose (docs/RETRAINING.md).
platform:
  projects:
    marswars: frc-rebuilt-fuel-a
    # Named frc-rebuilt-merged in the web app. Roboflow added the suffix,
    # since the name had just been used by a deleted project.
    merged: frc-rebuilt-merged-onokh
  # Retries per image. The SDK prints a failed upload instead of raising,
  # so frc-verify-upload is what catches a missing image.
  upload_retries: 3

# Scoring a model on a harmonized split with frc-evaluate (D-017, D-018).
evaluate:
  api_url: https://serverless.roboflow.com
  models_file: reports/models.yaml
  coverage_file: reports/class_coverage.json
  runs_dir: reports/runs
  # Precision, recall, and the confusion matrix count predictions at or above
  # this. A neutral default until Task 11 picks one for the robot's use.
  confidence: 0.5
  # A prediction must overlap a labeled box by more than this to count as a
  # hit in the confusion matrix. Precision and recall are read at 0.5 too.
  iou: 0.5
  # Mean average precision needs the low-confidence tail, so predictions are
  # requested and cached down to this.
  confidence_floor: 0.01
  # Only the most confident boxes per image are cached and scored, so an
  # unfamiliar scene's hundreds of faint boxes fit under the size limit. No
  # test image has more than 16 labeled boxes (D-020).
  max_predictions_per_image: 25
  pr_thresholds:
    start: 0.05
    stop: 0.95
    step: 0.05
  # Below the 500 KB (512000 byte) large-file hook. Raised from 450000 for
  # two-class runs on scorekeeper (D-025).
  max_prediction_bytes: 500000
  bootstrap:
    resamples: 1000
    level: 0.95
  # Fuel labels touching the edge are neither hits nor misses (D-027). The
  # tolerance matches inspect's.
  edge_ignore:
    classes: [fuel]
    tolerance_px: 1
    min_overlap: 0.5

# Slicing a model's errors with frc-diagnose, from its cached predictions (D-021).
diagnose:
  output_dir: reports/diagnosis
  # The model sees every image stretched to 384x384 (D-016), so brightness
  # and blur are measured at that size, which also makes blur comparable
  # across datasets of different resolutions.
  feature_px: 384
  # A false positive that overlaps a label by more than this, but not enough
  # to be a hit, is a localization error rather than background.
  localization_floor: 0.1
  # Brightness and blur are cut into this many equal-count bins, pooled over
  # every diagnosed split, so the edges are computed rather than chosen.
  feature_bins: 3
  # Lower edges of the bins for labeled boxes per image.
  crowding_edges: [0, 1, 2, 5, 10]
  # Quantiles reported when comparing training data with each test split.
  quantiles: [0.1, 0.5, 0.9]
  # Datasets with no recordings are sliced by the kind of photo, matched on
  # the source name in order. Anything unmatched is "other".
  sources:
    scorekeeper:
      - name: fuel photos
        pattern: '^frame_\d+\.'
      - name: 2024 Milford broadcast
        pattern: 'Milford'
      - name: frc_train photos
        pattern: '^frc_train_'
      - name: YouTube frames
        pattern: '^(?:[A-Za-z0-9_-]{11}_\d+|youtube-\d+)\.'
  # Failure gallery at docs/assets/failures.png. Picks alternate between
  # false positives and misses, spread over sources. Excluded files show a
  # face, and the next pick takes their place.
  gallery:
    rows: 4
    cols: 4
    tile_px: 320
    max_bytes: 450000
    per_dataset:
      marswars: 4
      robotzftp2: 4
      scorekeeper: 8
    # Frames of one recording closer than this look alike, so only one is shown.
    min_frame_gap: 30
    # Every frame of this broadcast shows the same front row of spectators
    # close to the camera.
    exclude_sources:
      scorekeeper:
        - 2024 Milford broadcast
    exclude:
      marswars:
        - Basler_daA1280-54uc__24770352__20260112_180305685_0210_png.rf.b40a0a55f146f485842e11df2ce40771.jpg
        - Basler_daA1280-54uc__24770352__20260112_180305685_0199_png.rf.2836889989fe4bd868b82d1805a22d67.jpg
      scorekeeper:
        - PXL_20220219_190751379_jpg.rf.f67de0751a2245e075ee6d9b63c5c2bf.jpg
        - frc_train_612_jpg.rf.154710d49abc64e36c0024a44abb0196.jpg
        - Match-12-R4-2024-FIM-District-Milford-Event-presented-by-GM-Milford-Proving-Ground_mp4-0068_jpg.rf.9353b82ca8a7d81c85954f6aa544c1dc.jpg
        - -Q97WO6Zc_U_2_jpg.rf.145d637161a1eb8f552490511cd13501.jpg
        - frc_train_486_jpg.rf.6fea1a9968929ab2e2108349a4621082.jpg
        - z6S7XrF5CI0_3_jpg.rf.85300f901b2993feebb5fddfe1875caf.jpg
        - youtube-47_jpg.rf.8146c5006d3ba11719ee2c95df2c4b6d.jpg
        - youtube-129_jpg.rf.e44f2aae349ff2bd94fb58615ffb4a94.jpg
        - FRC_3_mp4-4_jpg.rf.6d996c77f6f9102953c59b9d026cf8fb.jpg
        - youtube-19_jpg.rf.a56715b9c2890fe929978c5a6d1cb548.jpg
        - ncash2023_gopro3-mp4_00805_png.rf.7f96d0520faf1b0c2b32db16fc191ea1.jpg
        - youtube-15_jpg.rf.a81798214470ddbd444c348ab9b29c1b.jpg
        - FRC_3_mp4-26_jpg.rf.31bfbd8f50e2dd92f354977e2f850ae9.jpg
        - youtube-32_jpg.rf.ee5c85e6951fac99a8642552d2a9fee6.jpg
        - youtube-56_jpg.rf.a0dcf146f9de78d932ca82ff18152db7.jpg
  # A seeded sample of false positives and of misses per dataset, cropped
  # onto sheets under data/contact_sheets/ (frc-diagnose --review-sheet) and
  # judged by eye into the file below. The sheets can show faces, so they
  # stay out of docs/.
  review:
    rows: 5
    cols: 8
    tile_px: 160
    per_kind: 40
    context: 4
    min_crop_px: 96
    file: reports/diagnosis/review.csv
    verdicts:
      # False positives
      - unlabeled fuel
      - ball from another game
      - person
      - other yellow object
      - robot part
      - field or venue element
      # Either kind: the model's box merges, splits, or doubles labeled
      # fuel, the label is the loose one, or the ball is cut off by the
      # image edge and neither box is clearly right.
      - wrong box on labeled fuel
      - loose or offset label
      - ball cut off at the image edge
      # Misses
      - barely visible fuel
      - clear fuel
      - other
