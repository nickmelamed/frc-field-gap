# Models trained on the Roboflow platform, one entry per run.
# Filled in by hand from the training page after each run, following
# docs/RETRAINING.md. The exact version preprocessing and augmentation are
# in reports/platform_upload_<dataset>.json. null means not reported yet.

models:
  baseline-a:
    dataset: marswars
    split_report: reports/splits.json
    upload_report: reports/platform_upload_marswars.json
    project: frc-rebuilt-fuel-a
    # Version 2 adds the 384x384 resize, and version 1 is unused (D-016).
    version: 2
    version_name: harmonized-marswars-noaug-384
    # The workspace part of the model URL is left out, since it is derived
    # from an email address. The key's own workspace is used at run time.
    model_id: frc-rebuilt-fuel-a-2-rfdetr-nano-t1
    architecture: RF-DETR (Nano)
    checkpoint: none shown
    input_size: 384x384 (Stretch to)
    preprocessing: auto-orient, resize 384x384 (Stretch to)
    augmentation: none
    train_time_augmentation: none
    # As shown on the training page before the run started.
    estimate:
      credits: 1.31
      training_time: 14 to 39 minutes
      max_epochs: 100
      early_stopping: true
    credit_cap: 5
    epochs: 100
    other_settings: {}
    trained: 2026-09-27
    credits_used: 0.71
    # Roboflow's own evaluation on the test split, copied from the model
    # page. Its confidence threshold was picked on that same split, so these
    # are not the project's results, which come from make report.
    platform_reported:
      split: test
      images: 171
      confidence: 0.46
      map50: 0.949
      map50_95: 0.620
      map75: 0.687
      small_map50_95: 0.604
      medium_map50_95: 0.728
      precision: 0.966
      recall: 0.932
      f1: 0.949
      true_positives: 424
      false_negatives: 31
      false_positives: 15
      median_latency_ms: 3.5
    notes: null

  merged-noaug:
    dataset: merged
    split_report: reports/merge.json
    upload_report: reports/platform_upload_merged_v7.json
    # Named frc-rebuilt-merged in the web app. Versions 3 and 4 passed the
    # upload check but Roboflow refused to train them (D-029).
    project: frc-rebuilt-merged-onokh
    version: 7
    version_name: harmonized-merged-noaug-384
    model_id: frc-rebuilt-merged-onokh-7-rfdetr-nano-t1
    architecture: RF-DETR (Nano)
    # The model page shows "-".
    checkpoint: none shown
    input_size: 384x384 (Stretch to)
    preprocessing: auto-orient, resize 384x384 (Stretch to)
    augmentation: none
    train_time_augmentation: none
    estimate: null
    credit_cap: 5
    # Not reported yet. It stopped before the cap, so on early stopping.
    epochs: null
    early_stopping: true
    other_settings: {}
    trained: 2026-09-29
    credits_used: 2.35
    # Roboflow's own evaluation on the merged test split (A, B, and C test
    # together), copied from the model page. Its threshold was picked on
    # that same split, so these are reference only. Project results come
    # from make report.
    platform_reported:
      split: test
      images: 771
      confidence: 0.44
      map50: 0.918
      map50_95: 0.615
      map75: 0.647
      small_map50_95: 0.561
      medium_map50_95: 0.658
      large_map50_95: 0.846
      precision: 0.909
      recall: 0.907
      f1: 0.908
      # From the confusion matrix. Fuel hits are the 1206 labeled fuel boxes
      # less the 55 misses, since the page rounds them to 1.15k.
      per_class:
        fuel: {true_positives: 1151, false_negatives: 55, false_positives: 80}
        robot: {true_positives: 865, false_negatives: 142, false_positives: 115}
      median_latency_ms: 3.8
    notes: null
