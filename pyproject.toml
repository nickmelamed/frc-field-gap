[project]
name = "frc-xdata"
version = "0.0.0"
description = "Cross-dataset generalization for FRC REBUILT game-piece and robot detection."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nick Melamed" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "imagehash>=4.3,<5",
    "numpy>=2.0,<2.4",
    "pillow>=10.0",
    "pydantic>=2.8,<2.12",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "roboflow>=1.5,<1.6",
    "supervision>=0.29,<0.30",
]

[project.scripts]
frc-download = "frc_xdata.download:main"
frc-inspect = "frc_xdata.inspect_datasets:main"
frc-harmonize = "frc_xdata.harmonize:main"
frc-upload = "frc_xdata.upload:upload_main"
frc-verify-upload = "frc_xdata.upload:verify_main"
frc-evaluate = "frc_xdata.evaluate:main"
frc-report = "frc_xdata.report:main"

[project.optional-dependencies]
infer = ["inference>=1.7,<1.8"]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.9",
    "types-PyYAML>=6.0.12",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.11.14"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["scripts/agent"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

# roboflow ships without type hints or a py.typed marker.
[[tool.mypy.overrides]]
module = ["roboflow", "roboflow.*"]
ignore_missing_imports = true

# inference-sdk ships without a py.typed marker, and CI does not install it.
[[tool.mypy.overrides]]
module = ["inference_sdk", "inference_sdk.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "-m",
    "not integration",
    "--cov=frc_xdata",
    "--cov-report=term-missing",
]
markers = [
    "integration: needs the network or real data, skipped in CI",
    "slow: takes more than a few seconds",
]

[tool.coverage.run]
branch = true
source = ["frc_xdata"]

[tool.coverage.report]
fail_under = 80
show_missing = true
